<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Sederhana</title>
</head>
<body style="margin: 0; font-family: Arial, Helvetica, sans-serif; color: black; background: #fafafa; line-height: 1.7;">

    <style>
        header {background: #fff; border-bottom: 1px solid #ececec; padding: 24px 40px; display: flex; justify-content: space-between; align-items: center;}
        header h1 {font-size: 20px; font-weight: 600;}
        nav a {color: #444; text-decoration: none; margin-left: 28px; font-size: 14px;}
        nav a:hover {color: #000;}
        main {max-width: 720px; margin: 0 auto; padding: 60 24px;}
        section {margin-bottom: 64px;}
        section h2 {font-size: 22px; font-weight: 600; margin-bottom: 16px;}
        section p {color: #444; font-size:  15px;}
        #hero {text-align: center; padding: 40px 0 20px;}
        #hero h2 {font-size: 32px;}
        #hero p {color: #000; max-width: 480px; margin: 12px auto;}
        footer {text-align: center; padding: 28px; border-top: #ececec; color: #444; font-size: 13px;}
        footer a {color: #444;}
        form {display: flex ; flex-direction: column;}
        label {font-size: 14px; margin-top: 14px; margin-bottom: 6px;}
        input, textarea {padding: 10px; border: 1px solid #ececec; border-radius: 6px; font-family: inherit; font-size: 14px;}
        button {margin-top: 20px; padding: 10px; background-color: #1a1a1a; color: #fff; border: none; border-radius: 6px; cursor: pointer; width: fit-content;}
        button:hover {background: #333;}
    </style>

    <header>
        <h1>Kuro</h1>
        <nav>
            <a href="#tentang">Tentang</a>
            <a href="#kontak">Kontak</a>
        </nav>
    </header>

    <main>

        <section id="hero">
            <h2>Website Sederhana</h2>
            <p>Dibuat menggunakan HTML dan CSS</p>
        </section>

        <section id="tentang">
            <h2>Tentang</h2>
            <p>Saya adalah Mahasiswa Informatika Semester 3 yang mempelajari HTML dengan menggunakan VSCode</p>
        </section>

        <section id="kontak">
            <h2>Kontak</h2>
            <p>Silahkan Hubungi saya melalui email di
                <a href="mailto:nama@gmail.com">nama@gmail.com</a>
            </p>

            <form>
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" placeholder="Nama Lengkap">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nama@gmail.com">

                <label for="pesan">Pesan</label>
                <textarea name="pesan" id="pesan" placeholder="Tulis  Pesan...."></textarea>

                <button type="submit">Kirim</button>
            </form>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kuro.</p>
    </footer>
    
</body>
</html>
